<svg xmlns="http://www.w3.org/2000/svg" width="960" height="512" viewBox="0 0 960 512" role="img" aria-labelledby="title desc">
<title id="title">이미지 수집부터 학습 모델 준비까지</title><desc id="desc">수집, 라벨링, 학습을 별도로 실행합니다. 카메라 이미지를 서버에 저장하고 Android에서 라벨을 지정한 뒤 내려받아 Teachable Machine에서 학습합니다.</desc>
