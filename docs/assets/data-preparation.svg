<rect x="28" y="443" width="904" height="44" rx="10" fill="#f1f5f9" stroke="#f1f5f9"/>
<text x="48" y="471" font-size="16" fill="#475569" font-weight="400" text-anchor="start">라벨링과 학습은 수동으로 진행하며, 완성한 모델을 현장 추론에 사용합니다.</text>
