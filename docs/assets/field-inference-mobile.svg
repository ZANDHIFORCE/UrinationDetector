<svg xmlns="http://www.w3.org/2000/svg" width="440" height="886" viewBox="0 0 440 886" role="img" aria-labelledby="title desc">
<title id="title">Raspberry Pi 현장 추론과 음성 경고</title><desc id="desc">카메라 프레임을 전처리해 Keras 모델로 분류합니다. 노상방뇨 또는 흡연이며 신뢰도가 0.8을 초과할 때 Espeak로 경고하고 다음 프레임을 처리합니다.</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#94a3b8"/></marker></defs>
<g font-family="'Malgun Gothic','Apple SD Gothic Neo','Noto Sans KR',sans-serif">
<rect x="1" y="1" width="438" height="884" rx="20" fill="#f8fafc" stroke="#e2e8f0"/>
<text x="28" y="43" font-size="23" fill="#0f172a" font-weight="700" text-anchor="start">학습한 모델을 현장에서 실행</text>
<text x="28" y="71" font-size="16" fill="#64748b" font-weight="400" text-anchor="start">Raspberry Pi · 카메라 · Keras · Espeak</text>
<rect x="24" y="104" width="392" height="162" rx="12" fill="white" stroke="#e2e8f0"/>
<text x="42" y="135" font-size="18" fill="#0f172a" font-weight="700" text-anchor="start">01  프레임 입력</text>
<rect x="38" y="156" width="364" height="62" rx="12" fill="#eff6ff" stroke="#eff6ff"/>
<text x="54" y="182" font-size="18" fill="#2563eb" font-weight="700" text-anchor="start">카메라 프레임</text>
<text x="54" y="205" font-size="14" fill="#475569" font-weight="400" text-anchor="start">크기 조정 · 정규화</text>
<text x="42" y="245" font-size="15" fill="#64748b" font-weight="400" text-anchor="start">입력 이미지를 전처리</text>
<path d="M 220 270 V 296" fill="none" stroke="#94a3b8" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"/>
<rect x="24" y="304" width="392" height="162" rx="12" fill="white" stroke="#e2e8f0"/>
<text x="42" y="335" font-size="18" fill="#0f172a" font-weight="700" text-anchor="start">02  모델 분류</text>
<rect x="38" y="356" width="364" height="62" rx="12" fill="#f5f3ff" stroke="#f5f3ff"/>
<text x="54" y="382" font-size="18" fill="#7c3aed" font-weight="700" text-anchor="start">Keras 모델 추론</text>
<text x="54" y="405" font-size="14" fill="#475569" font-weight="400" text-anchor="start">예측 클래스 · 신뢰도 반환</text>
<text x="42" y="445" font-size="15" fill="#64748b" font-weight="400" text-anchor="start">모델 파일 + 라벨 파일 사용</text>
<path d="M 220 470 V 496" fill="none" stroke="#94a3b8" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"/>
<rect x="24" y="504" width="392" height="162" rx="12" fill="white" stroke="#e2e8f0"/>
<text x="42" y="535" font-size="18" fill="#0f172a" font-weight="700" text-anchor="start">03  조건에 따라 경고</text>
<rect x="38" y="556" width="364" height="62" rx="12" fill="#f0fdfa" stroke="#f0fdfa"/>
<text x="54" y="582" font-size="18" fill="#0f766e" font-weight="700" text-anchor="start">Espeak 음성 경고</text>
<text x="54" y="605" font-size="14" fill="#475569" font-weight="400" text-anchor="start">노상방뇨 또는 흡연</text>
<text x="42" y="645" font-size="16" fill="#0f766e" font-weight="700" text-anchor="start">신뢰도 &gt; 0.8일 때 실행</text>
<rect x="24" y="702" width="392" height="65" rx="12" fill="#f1f5f9" stroke="#f1f5f9"/>
<text x="44" y="729" font-size="17" fill="#475569" font-weight="700" text-anchor="start">조건을 충족하지 않으면 경고 생략</text>
<text x="44" y="751" font-size="15" fill="#64748b" font-weight="400" text-anchor="start">경고 여부와 관계없이 다음 프레임 처리</text>
<path d="M 220 670 V 694" fill="none" stroke="#94a3b8" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"/>
<text x="28" y="812" font-size="16" fill="#64748b" font-weight="400" text-anchor="start">완성한 모델로 추론만 수행합니다.</text>
<text x="28" y="838" font-size="16" fill="#64748b" font-weight="400" text-anchor="start">현장에서 모델을 다시 학습하지 않습니다.</text>
</g></svg>
